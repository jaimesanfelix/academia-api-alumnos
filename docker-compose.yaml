# docker-compose.yml (en la raíz del proyecto)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: academia
      POSTGRES_DB: academia
    ports:
      - '5432:5432'
    volumes:
      - academia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U academia']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  academia_pgdata:
